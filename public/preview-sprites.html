<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Preview revelado con sprites</title>
<style>
  :root { --navy: #21255c; --teal: #248caa; --bg: #ffffff; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--navy); padding: 40px 32px 80px; }
  h1 { font-size: 28px; margin: 0 0 6px; }
  p.lead { margin: 0 0 32px; opacity: .7; max-width: 720px; line-height: 1.5; }
  section { border-top: 1px solid #21255c1a; padding: 28px 0; display: grid; grid-template-columns: 220px 1fr 260px; gap: 24px; align-items: center; }
  section h2 { font-size: 18px; margin: 0 0 6px; }
  section small { opacity: .6; line-height: 1.4; display: block; }
  .logos { display: flex; gap: 48px; align-items: center; flex-wrap: wrap; --logo-h: 44px; }
  .logo { position: relative; height: var(--logo-h); cursor: pointer; }
  .logo img { height: 100%; width: auto; display: block; }
  .logo .base { opacity: .75; }
  .logo .color { position: absolute; inset: 0; }
  .sheet { display: flex; gap: 4px; flex-wrap: wrap; }
  .sheet canvas { width: 36px; height: 18px; background: #eef1f4; border-radius: 3px; }
  .btn { margin-top: 10px; font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 99px; border: 1px solid #21255c33; background: #fff; color: var(--navy); cursor: pointer; }

  /* actual: fundido de opacidad */
  .fade .color { opacity: 0; transition: opacity .5s; }
  .fade .on .color { opacity: 1; }
  .fade .on .base { opacity: 0; transition: opacity .3s; }

  /* sprites: la capa de color se recorta con la hoja de máscaras (12 cuadros) y, si es un logo
     de un solo color, además con la forma del logo (dos máscaras intersectadas) */
  .sprite .color { opacity: 0; mask-size: 1200% 100%, 100% 100%; -webkit-mask-size: 1200% 100%, 100% 100%; mask-repeat: no-repeat; -webkit-mask-repeat: no-repeat; mask-composite: intersect; -webkit-mask-composite: source-in; mask-position: 0% 0, 0 0; -webkit-mask-position: 0% 0, 0 0; }
  .sprite .on .color { opacity: 1; animation: reveal var(--dur, .9s) steps(12, jump-none) both; }
  .sprite .on .base { opacity: .12; transition: opacity .6s .25s; }
  @keyframes reveal { from { mask-position: 0% 0, 0 0; -webkit-mask-position: 0% 0, 0 0; } to { mask-position: 100% 0, 0 0; -webkit-mask-position: 100% 0, 0 0; } }
</style>
</head>
<body>
<h1>Revelado de color con sprites</h1>
<p class="lead">Cada fila enciende los logos en bucle. También puedes pasar el mouse sobre un logo. Cada estilo usa una sola hoja de 12 cuadros (a la derecha) para todos los logos; la animación es CSS puro (<code>steps()</code>).</p>

<div id="rows"></div>

<script>
const LOGOS = [
  { src: "/sponsors/bci.webp", color: "/sponsors/bci-color.webp" },
  { src: "/sponsors/scotiabank.webp", tint: "#ec111a" },
  { src: "/sponsors/hdi.webp", tint: "#006f3c" },
  { src: "/sponsors/itau.webp", tint: "#ec7000" },
  { src: "/sponsors/bancobogota.webp", color: "/sponsors/bancobogota-color.webp" },
  { src: "/sponsors/metlife.webp", tint: "#0090da" },
];

const FRAMES = 12, FW = 240, FH = 120;

// ruido suave y determinista para bordes orgánicos
function rnd(seed) { let s = seed; return () => ((s = (s * 16807) % 2147483647) / 2147483647); }

function makeSheet(drawFrame) {
  const c = document.createElement("canvas");
  c.width = FW * FRAMES; c.height = FH;
  const g = c.getContext("2d");
  const thumbs = [];
  for (let k = 0; k < FRAMES; k++) {
    g.save(); g.translate(k * FW, 0); g.beginPath(); g.rect(0, 0, FW, FH); g.clip();
    g.fillStyle = "#000";
    drawFrame(g, k / (FRAMES - 1));
    g.restore();
    const t = document.createElement("canvas"); t.width = FW; t.height = FH;
    t.getContext("2d").drawImage(c, k * FW, 0, FW, FH, 0, 0, FW, FH);
    thumbs.push(t);
  }
  return { url: c.toDataURL("image/png"), thumbs };
}

// avance parejo (suave al inicio y al final): el revelado se reparte en los 12 cuadros
const ease = (t) => t * t * (3 - 2 * t);

const STYLES = [
  {
    name: "Tinta",
    note: "Una mancha que se expande desde un punto, con bordes irregulares y gotitas.",
    draw(g, t) {
      const r = rnd(7);
      const R = ease(t) * 300;
      const cx = 30, cy = 92;
      g.beginPath();
      for (let a = 0; a <= Math.PI * 2 + 0.01; a += 0.05) {
        const n = 1 + 0.16 * Math.sin(a * 5 + 1.3) + 0.09 * Math.sin(a * 11 + 0.4) + 0.05 * Math.sin(a * 23);
        const x = cx + Math.cos(a) * R * n, y = cy + Math.sin(a) * R * n * 0.8;
        a ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.fill();
      // gotitas por delante del borde
      for (let i = 0; i < 26; i++) {
        const a = r() * Math.PI * 2, d = R * (1.02 + r() * 0.35), s = 2 + r() * 7 * (1 - t * 0.5);
        g.beginPath(); g.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d * 0.8, s, 0, 7); g.fill();
      }
    },
  },
  {
    name: "Líquido",
    note: "El color sube como un líquido, con la superficie ondulando.",
    draw(g, t) {
      const level = FH * (1.1 - ease(t) * 1.35);
      g.beginPath(); g.moveTo(0, FH);
      for (let x = 0; x <= FW; x += 4) {
        const y = level + Math.sin(x / 22 + t * 9) * 7 * (1 - t * 0.6) + Math.sin(x / 9 + t * 5) * 2.5;
        g.lineTo(x, y);
      }
      g.lineTo(FW, FH); g.closePath(); g.fill();
    },
  },
  {
    name: "Barrido",
    note: "Una pincelada diagonal que cruza el logo, con borde áspero.",
    draw(g, t) {
      const r = rnd(3);
      const pos = -20 + ease(t) * (FW + 110);
      g.beginPath(); g.moveTo(-10, -10);
      for (let y = -10; y <= FH + 10; y += 4) {
        const x = pos - y * 0.55 + (r() - 0.5) * 14 + Math.sin(y / 6) * 4;
        g.lineTo(x, y);
      }
      g.lineTo(-10, FH + 10); g.closePath(); g.fill();
    },
  },
];

const rows = document.getElementById("rows");

function logoEl(l, mask) {
  const w = document.createElement("div"); w.className = "logo";
  const base = new Image(); base.src = l.src; base.className = "base"; w.append(base);
  let color;
  if (l.color) {
    color = new Image(); color.src = l.color; color.className = "color";
    if (mask) { color.style.maskImage = color.style.webkitMaskImage = `url(${mask})`; color.style.maskSize = color.style.webkitMaskSize = "1200% 100%"; }
  } else {
    color = document.createElement("span"); color.className = "color";
    color.style.background = l.tint;
    const m = mask ? `url(${mask}), url(${l.src})` : `url(${l.src})`;
    color.style.maskImage = color.style.webkitMaskImage = m;
    if (!mask) { color.style.maskSize = color.style.webkitMaskSize = "100% 100%"; }
  }
  w.append(color);
  w.addEventListener("mouseenter", () => replay(w));
  w.addEventListener("mouseleave", () => w.classList.remove("on"));
  return w;
}

function replay(el) { el.classList.remove("on"); void el.offsetWidth; el.classList.add("on"); }

function row(title, note, cls, sheet) {
  const s = document.createElement("section"); s.className = cls;
  s.innerHTML = `<div><h2>${title}</h2><small>${note}</small></div>`;
  const logos = document.createElement("div"); logos.className = "logos";
  const els = LOGOS.map((l) => logoEl(l, sheet?.url));
  logos.append(...els); s.append(logos);
  const side = document.createElement("div");
  if (sheet) {
    const sh = document.createElement("div"); sh.className = "sheet"; sh.append(...sheet.thumbs); side.append(sh);
    const lbl = document.createElement("small"); lbl.textContent = "Hoja de máscaras (12 cuadros)"; lbl.style.marginTop = "6px"; side.append(lbl);
  }
  s.append(side); rows.append(s);
  // bucle: se encienden de a uno y se apagan todos
  let i = 0;
  setInterval(() => {
    if (i === els.length) { els.forEach((e) => e.classList.remove("on")); i = -1; }
    else if (i >= 0) replay(els[i]);
    i++;
  }, 650);
}

row("Actual", "Fundido de opacidad (como está hoy).", "fade", null);
STYLES.forEach((st) => row(st.name, st.note, "sprite", makeSheet(st.draw)));
</script>
</body>
</html>
